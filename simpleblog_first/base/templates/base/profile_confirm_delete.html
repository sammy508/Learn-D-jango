{% extends "main.html" %}
{% block content %}
<div style="max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h2>Delete Profile</h2>
    <p>Are you sure you want to <strong>permanently delete</strong> your profile "{{ profile.user.username }}"?</p>
    <p>This action cannot be undone.</p>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" style="padding: 8px 16px; background-color: red; color: white; border: none; border-radius: 4px;">Yes, Delete</button>
        <a href="{% url 'my-profile' %}" style="padding: 8px 16px; margin-left: 10px; background-color: #ccc; color: black; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}

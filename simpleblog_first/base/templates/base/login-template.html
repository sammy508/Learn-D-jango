{% extends 'main.html' %}

{% block content %}
<div class="login-page" style="display:flex; justify-content:center; align-items:center; min-height:80vh; background:#f5f6fa;">
    <div class="login-container" style="background:#fff; padding:40px 30px; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:400px;">
        <h2 style="text-align:center; margin-bottom:30px; color:#333;">Login</h2>
        <form action="#" method="POST">
            {% csrf_token %}
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ccc; border-radius:5px;">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ccc; border-radius:5px;">

            <button type="submit" style="width:100%; padding:12px; background:#007BFF; color:#fff; border:none; border-radius:5px; cursor:pointer; font-size:16px;">Login</button>
        </form>
        <div class="footer" style="text-align:center; margin-top:15px; font-size:14px; color:#777;">
            <p>Don't have an account? <a href="#">Sign up</a></p>
            <p><a href="#">Forgot Password?</a></p>
        </div>
    </div>
</div>
{% endblock content %}
